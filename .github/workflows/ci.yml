name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: scripts/fetch_pdk.sh sky130
      - run: pip install -e '.[dev]'
      - run: TAPEOUT_OFFLINE=1 pytest -q
      - name: re-simulate every deck in the bundled recording on this runner
        run: python -m tapeout.verify web/replays/ppg-offline.jsonl
  image:
    # The image's own build fails unless a half adder is proved and a
    # slow-corner 85C fork simulates inside it, so a green build is the check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tapeout .
      - name: smoke-test the running container (offline mode)
        run: |
          docker run -d -p 8010:8010 --name tapeout-smoke tapeout
          for i in $(seq 30); do curl -sf localhost:8010/healthz && break; sleep 2; done
          curl -sf localhost:8010/api/status || { docker logs tapeout-smoke; exit 1; }
          curl -sf localhost:8010/ | grep -q "Tape out"
